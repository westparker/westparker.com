  <!-- Styles for this page only. Colors and fonts come from site.css. -->
  <style>
    .bio {
      max-width: 34rem;
      margin: 0 auto;
      padding: clamp(3.5rem, 12vh, 7rem) 1.25rem 3rem;
      text-align: center;
    }

    .bio .avatar {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 25%;
      box-shadow: 0 0 0 3px var(--deep), 0 0 0 4px var(--polaris);
    }

    .bio h1 {
      margin: 1.5rem 0 0.35rem;
      font-family: var(--serif);
      font-weight: 400;
      font-size: 2.6rem;
      line-height: 1.1;
    }

    .bio .tagline {
      margin: 0 0 2.75rem;
      color: var(--haze);
      font-size: 1.1rem;
    }

    .pills {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 1rem;
    }

    /* One pill button: logo circle on the left, label centered */
    .pill-link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 4.25rem;
      padding: 0 4.5rem;
      border: 1px solid var(--chart);
      border-radius: 999px;
      background: rgba(236, 230, 214, 0.04);
      text-decoration: none;
      font-size: 1.2rem;
      letter-spacing: 0.01em;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .pill-link:hover {
      border-color: var(--polaris);
      background: rgba(242, 200, 121, 0.08);
    }

    .pill-link .logo {
      position: absolute;
      left: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      width: 3.25rem;
      height: 3.25rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--starlight);
      color: var(--deep);
    }

    .pill-link .logo svg { width: 1.6rem; height: 1.6rem; }

    .bio .home {
      display: inline-block;
      margin-top: 2.75rem;
      color: var(--haze);
      font-size: 1rem;
    }
  </style>
</head>
